schema_version: "1.1"
name: slow-down-after-weak-lessons
expected_outcome: |
  The tutor reads the note and slows down: it names a slow-down mode, runs mostly review with a short refresher of the recurring-error topics, introduces at most one micro-step (fui/fue only), at most two words from already seen ones, 15-16 typed exercises with no hints, and does not introduce hice/tuve or comí/vivió as new.
