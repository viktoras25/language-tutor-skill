schema_version: "1.1"
name: german-grading-keyboard-and-gender
expected_outcome: |
  The tutor produces a per-exercise table. It gives full credit to ae/oe/ue typed instead of umlauts (exercises 2 and 3) and to a lowercase 'ich' at the start (exercise 8); it gives partial credit to the wrong article (4), the word order after the time word (5) and the wrong auxiliary (6); it gives zero to the non-answer (7). The total is about 5.5/8 = 69%, new-material 0.5/2 = 25%. It says the step with sein is not passed, adds nothing new next lesson, reteaches the choice of sein or haben, and ends with an updated progress note.
